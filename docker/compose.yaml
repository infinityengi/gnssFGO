services:
  ros:
    image: haomingac/gnssfgo:latest
    container_name: gnssfgo
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
      - /dev/ttyACM1:/dev/ttyACM1
    volumes:
      - ${SSH_AUTH_SOCK}:${SSH_AUTH_SOCK}
      - ${HOME}/.ssh:/root/.ssh
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/DataSmall:/Data
      - ${PWD}/../:/workspace/fgo_ws/src/gnssFGO
      - type: tmpfs
        target: /workspace/fgo_ws/src/gnssFGO/novatel_oem7_utilities/novatel_oem7_driver # Remove this folder (doesn't compile)
      - build_gnssfgo:/workspace/build # Persist build
    environment:
      DISPLAY: ${DISPLAY}
      SSH_AUTH_SOCK: ${SSH_AUTH_SOCK}
      QT_X11_NO_MITSHM: 1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
volumes:
  build_gnssfgo:
